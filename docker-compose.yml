services:
  web:
    # Local/source deployments always build this image instead of pulling a mutable tag.
    image: frankmega:local
    build: .
    pull_policy: build
    # Cloudflare Tunnel is the only public path; loopback is for local debugging only.
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - uploads:/rails/storage/uploads
      - db_data:/rails/storage
    environment:
      # Required — app will not boot without these
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      # Required for first-run /setup until the admin account exists
      - SETUP_TOKEN=${SETUP_TOKEN}
      - HOST=${HOST}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      # Locale: set to pt-BR for Portuguese (default: en)
      - APP_LOCALE=${APP_LOCALE:-en}
      # SSL: defaults to true in production — set to false for local Docker testing without TLS
      - FORCE_SSL=${FORCE_SSL:-true}
      # Storage
      - STORAGE_PATH=/rails/storage/uploads
      - USER_DISK_QUOTA_BYTES=${USER_DISK_QUOTA_BYTES:-5368709120}
      # Thruster rejects bodies above this limit before Rails receives them.
      - MAX_REQUEST_BODY=1181116006
      # SMTP (optional — leave blank to disable email delivery)
      - SMTP_ADDRESS=${SMTP_ADDRESS:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    # cloudflared:latest digest verified and pinned 2026-08-15.
    image: cloudflare/cloudflared@sha256:de55830499e9adb1c580f7b5cbbdef86a3ff1715fb3ae6b3ff242f19de0afde8
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
  db_data:
