name: frank_mega

services:
  web:
    # Production must supply the immutable digest of the reviewed release image.
    image: akitaonrails/frankmega@${FRANKMEGA_IMAGE_DIGEST:?Set FRANKMEGA_IMAGE_DIGEST to the release sha256 digest}
    container_name: frank-mega-web
    restart: always
    # Cloudflare Tunnel is the only public path; loopback is for local debugging only.
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - /var/opt/docker/frank_mega/uploads:/rails/storage/uploads
      - /var/opt/docker/frank_mega/db:/rails/storage
    security_opt:
      - label:disable
    env_file:
      - .env.production
    environment:
      # Preserve the image's secure default when the sample env file leaves this blank.
      - MAX_REQUEST_BODY=${MAX_REQUEST_BODY:-1181116006}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
